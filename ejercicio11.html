<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Kilómetros a Millas</title>
    <link rel="stylesheet" href="css/ejercicio11.css">
</head>
<body>
    <div class="calculadora">
        <h1>Conversor Kilómetros → Millas</h1>
        <p class="subtitulo">Ingresa una distancia en kilómetros para convertir a millas</p>
        <form id="formulario" class="formulario">
            <div class="formulario">
                <label for="kilometros">Distancia en kilómetros (km):</label>
                <input type="number" id="kilometros" step="any" required>
            </div>

            <div class="grupo-formulario">
                <label for="millas">Distancia en millas (mi):</label>
                <input type="text" id="millas" readonly>
            </div>
            <button type="button" onclick="convertir()" class="boton-convertir">Convertir</button>
            <p id="mensajeError" class="mensaje-error"></p>
        </form>
    </div>
    <script src="js/ejercicio11.js"></script>
</body>
</html>
