<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Basica</title>
    <link rel="stylesheet" href="css/ejercicio16.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="calculadora">
        <h1>Calculadora Básica</h1>
        <p class="subtitulo">Ingresa dos números y elige una operación</p>

        <form id="formulario" class="formulario" onsubmit="return false;">
            <div class="formulario">
                <label for="numero1">Número 1:</label>
                <input type="text" id="numero1" autocomplete="off">
            </div>

            <div class="formulario">
                <label for="numero2">Número 2:</label>
                <input type="text" id="numero2" autocomplete="off">
            </div>

            <div class="botones">
                <button type="button" onclick="calcularOperacion('suma')" class="boton-op">Sumar</button>
                <button type="button" onclick="calcularOperacion('resta')" class="boton-op">Restar</button>
                <button type="button" onclick="calcularOperacion('multiplicacion')" class="boton-op">Multiplicar</button>
                <button type="button" onclick="calcularOperacion('division')" class="boton-op">Dividir</button>
            </div>

            <div class="grupo-formulario">
                <label for="resultado">Resultado:</label>
                <input type="text" id="resultado" readonly>
            </div>
        </form>
    </div>
    <script src="js/ejercicio16.js"></script>
</body>
</html>
