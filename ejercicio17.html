<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Tareas</title>
    <link rel="stylesheet" href="css/ejercicio17.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="contenedor">
        <h1>Gestión de Tareas</h1>
        <p class="subtitulo">Agrega, visualiza y/o elimina tus tareas pendientes</p>

        <div class="formulario">
            <input type="text" id="nuevaTarea" placeholder="Escribe una nueva tarea..." autocomplete="off">
            <button type="button" id="btnAgregar" class="boton-agregar">Agregar Tarea</button>
        </div>

        <div id="listaTareas" class="lista-tareas"></div>
    </div>
    <script src="js/ejercicio17.js"></script>
</body>
</html>
