<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Pesos Mexicanos a Dólares</title>
    <link rel="stylesheet" href="css/ejercicio12.css">
</head>
<body>
    <div class="calculadora">
        <h1>Conversor MXN → USD</h1>
        <p class="subtitulo">Ingresa una cantidad en pesos mexicanos para convertir a dólares</p>
        <form id="formulario" class="formulario">
            <div class="formulario">
                <label for="pesos">Cantidad en pesos mexicanos (MXN):</label>
                <input type="number" id="pesos" step="any" required>
            </div>

            <div class="grupo-formulario">
                <label for="dolares">Cantidad en dólares (USD):</label>
                <input type="text" id="dolares" readonly>
            </div>
            <button type="button" onclick="convertir()" class="boton-convertir">Convertir</button>
            <p id="mensajeError" class="mensaje-error"></p>
        </form>
    </div>
    <script src="js/ejercicio12.js"></script>
</body>
</html>
