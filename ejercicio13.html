<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Votación</title>
    <link rel="stylesheet" href="css/ejercicio13.css">
</head>
<body>
    <div class="calculadora">
        <h1>¿Puedes Votar?</h1>
        <p class="subtitulo">Ingresa tu edad para verificar si puedes votar</p>
        <form id="formulario" class="formulario">
            <div class="formulario">
                <label for="edad">Edad (años):</label>
                <input type="number" id="edad" step="1" min="0" required>
            </div>

            <div class="grupo-formulario">
                <label for="resultado">Resultado:</label>
                <input type="text" id="resultado" readonly>
            </div>
            <button type="button" onclick="verificar()" class="boton-verificar">Verificar</button>
            <p id="mensajeError" class="mensaje-error"></p>
        </form>
    </div>
    <script src="js/ejercicio13.js"></script>
</body>
</html>
